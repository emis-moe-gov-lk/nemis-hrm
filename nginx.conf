user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml;
    gzip_min_length 256;

    # ===============================
    # Laravel API Backend
    # ===============================
    server {
        listen 80;
        server_name backend.localhost;

        root /var/www/laravel/public;
        index index.php index.html;

        access_log /var/log/nginx/laravel-access.log;
        error_log /var/log/nginx/laravel-error.log;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000; # php-fpm service (Docker name or localhost:9000)
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~ /\.ht {
            deny all;
        }
    }

    # ===============================
    # React Frontend
    # ===============================
    server {
        listen 80;
        server_name frontend.localhost;

        root /var/www/react/dist;
        index index.html;

        access_log /var/log/nginx/react-access.log;
        error_log /var/log/nginx/react-error.log;

        # Serve React build files
        location / {
            try_files $uri /index.html;
        }

        # Proxy API requests to Laravel
        location /api/ {
            proxy_pass http://backend.localhost/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}